services:
  coralapi:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    environment:
      CORALAPI_MODEL_DIR: /models
      CORALAPI_DEVICE: auto
      # CORALAPI_QUEUE_DEPTH: "16"
      # CORALAPI_MODEL_DOWNLOAD: "true"
    devices:
      # PCIe / M.2 module (gasket driver on the host creates /dev/apex_0):
      - /dev/apex_0:/dev/apex_0
      # USB Accelerator: comment the line above and uncomment below. The whole
      # bus is needed because the device re-enumerates with a new ID after
      # runtime firmware upload.
      # - /dev/bus/usb:/dev/bus/usb
    restart: unless-stopped

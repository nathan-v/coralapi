name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync
      # The suite is hardware-independent: the Edge TPU delegate is mocked,
      # so no Coral device or libedgetpu is needed on runners.
      - run: uv run pytest -v

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build-only: the image requires a Coral TPU to start, so it cannot be
      # smoke-run on a runner. Publishing is left to a separate release step.
      - run: docker build -t coralapi:ci .
